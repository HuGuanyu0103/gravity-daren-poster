<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力专项档案·模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy:#1e3a84; --blue:#2f6cf0; --blue-d:#1c47a0; --purple:#6c62e9;
    --ink:#2a3556; --ink2:#46507a; --gray:#8891ad; --warn:#d98324;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  html,body{margin:0;}
  .page{width:941px;position:relative;font-family:var(--sans);
    background:linear-gradient(180deg,#d9e0ef 0%,#dde3f1 40%,#e3e8f4 100%);}
  .head-img{display:block;width:941px;}
  .body{padding:6px 54px 54px;position:relative;}
  .chips{display:flex;gap:10px;margin:8px 0 30px;flex-wrap:wrap;}
  .chip{font-size:20px;font-weight:700;color:var(--blue-d);
    background:rgba(47,108,240,.10);border:1.5px solid rgba(47,108,240,.35);
    border-radius:20px;padding:6px 18px;}
  .sec{margin-bottom:26px;}
  .sec-h{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .sec-n{width:46px;height:46px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(145deg,var(--purple),var(--blue));
    color:#fff;font-size:24px;font-weight:800;font-style:italic;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(47,108,240,.32);}
  .sec-t{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:.5px;}
  .sec-m{margin-left:auto;font-size:17px;font-weight:600;color:#fff;
    background:var(--blue);padding:4px 14px;border-radius:14px;}
  .card{background:rgba(255,255,255,.72);border:1px solid rgba(120,150,230,.35);
    border-radius:20px;padding:22px 26px;box-shadow:0 8px 24px rgba(60,90,180,.12);}
  .row{display:flex;gap:14px;padding:10px 0;align-items:flex-start;}
  .row+.row{border-top:1px solid rgba(120,150,230,.22);}
  .lbl{flex-shrink:0;font-size:19px;font-weight:800;color:var(--blue-d);width:96px;padding-top:2px;}
  .lbl.warn{color:var(--warn);}
  .lbl.warn::before{content:"▲ ";font-size:14px;}
  .val{flex:1;font-size:20px;color:var(--ink2);line-height:1.7;}
  .val b{color:var(--navy);font-weight:800;}
  .val .rn{color:var(--blue);font-weight:800;}
  .figs{display:flex;border-radius:16px;overflow:hidden;margin:4px 0 16px;
    background:linear-gradient(120deg,rgba(108,98,233,.14),rgba(47,108,240,.14));
    border:1.5px solid rgba(80,120,230,.3);}
  .fig{flex:1;text-align:center;padding:18px 6px;}
  .fig+.fig{border-left:1px solid rgba(120,150,230,.3);}
  .fig .v{font-size:40px;font-weight:800;color:var(--blue);font-style:italic;line-height:1;}
  .fig .v small{font-size:24px;}
  .fig .v.dk{color:var(--navy);}
  .fig .l{font-size:17px;color:var(--gray);margin-top:9px;font-weight:600;letter-spacing:1px;}
  .work{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:14px;
    padding-left:14px;border-left:4px solid var(--purple);}
  .cmp{font-size:17.5px;color:var(--ink2);line-height:1.6;margin:4px 0 14px;
    padding:10px 16px;background:rgba(47,108,240,.08);border-radius:10px;border-left:3px solid var(--blue);}
  .item{display:flex;gap:11px;font-size:20px;color:var(--ink2);line-height:1.6;margin-bottom:9px;}
  .item .no{flex-shrink:0;width:26px;height:26px;border-radius:50%;margin-top:2px;
    background:var(--warn);color:#fff;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}
  .item b{color:var(--navy);font-weight:800;}
  .verdict{margin-top:30px;padding:28px 30px;border-radius:20px;
    background:linear-gradient(135deg,#2b3f8f,#1c2c66);box-shadow:0 12px 30px rgba(30,50,130,.35);}
  .verdict .vt{font-size:21px;font-weight:800;color:#7fd0ff;letter-spacing:2px;margin-bottom:12px;}
  .verdict .vc{font-size:20px;line-height:1.85;color:#e3ebff;}
  .verdict .vc b{color:#fff;font-weight:800;}
  .verdict .vc .hl{color:#7fd0ff;font-weight:800;}
  .foot{text-align:center;margin-top:26px;font-size:16px;color:var(--gray);letter-spacing:3px;}
</style>
</head>
<body>
<div class="page">
  <img class="head-img" id="headImg" src="kv_head.png" alt="引力专项">
  <div class="body" id="body"></div>
</div>

<script>
/* ============================================================
 * ★★★ 换达人只改这个 DATA 对象即可 ★★★
 * 头部（logo/标题/头像/名字/赛道/人设）由 build_kv_head.py 生成 kv_head.png，
 * 此处负责下半部的内容区。富文本可用 <b>加粗</b> / <span class="rn">蓝色数字</span>。
 * ============================================================ */
const DATA = {
  chips: ["时尚穿搭类目","单品种草","穿搭教程","直播引流"],
  sections: [
    { no:"1", title:"达人档案与内容表现", rows:[
      { k:"基础信息", v:'抖音 <b>3.1万粉</b>／小红书 <b>5.7万粉</b>，女粉占比 <span class="rn">98.6%</span>，21-40 岁占 <b>83%</b>' },
      { k:"内容产能", v:'近 30 天抖音发文 <span class="rn">4 条</span>（低于小红书 6 条），稿均点赞 <b>500+</b>，优于小红书 300+' },
      { k:"经营重心", v:'直播占据 <b>65%</b> 以上精力，是主要变现渠道，配 <b>2 位助理</b>专职选品运营；短视频为直播引流' },
    ]},
    { no:"2", title:"近期爆款样本", work:"8双！我的夏日爱鞋合集",
      figs:[ {v:"2806",l:"点赞",dk:true},{v:"159",l:"评论",dk:true},{v:"1479",l:"收藏"} ],
      rows:[
        { k:"爆点归因", v:'「8双」强化数量感 + 清单体标题自带完播诱导，全品类满足夏日囤货；<b>收藏率极高</b>，强「存下来等我买」属性，典型种草清单型爆款' },
        { k:"可优化", warn:true, v:'风格不够鲜明，建议强化穿搭场景（通勤、旅行），帮目标客群对号入座' },
      ]},
    { no:"3", title:"抖音首播数据", meta:"8/2 首播 · 4h50min",
      figs:[ {v:'<small>¥</small>5.9<small>万</small>',l:"单场 GMV"},{v:"66",l:"ACU",dk:true},{v:'70<small>%</small>',l:"粉丝交易"},{v:'1\'30"',l:"平均留人",dk:true} ],
      cmp:"对标小红书（ACU 154、场均 GMV 50万），抖音仍处起步阶段，GMV／ACU 有提升空间。",
      rows:[ { k:"开播背景", v:'达人希望拓展新平台，Q2 了解<b>抖音引力专项</b>政策，完成人力筹备后于 8 月开始直播' } ],
      itemsTitle:"开播待优化",
      items:[ '产品工具不熟——<b>未用直播预告插件</b>等能力，预热不足', '直播间场景简陋——<b>光线暗、无贴片</b>，画面筹备不充分' ],
      rows2:[ { k:"选品方向", v:'价格带 <b>200-800</b>，首场与小红书策略一致，夏装为主，也搭配部分初秋女装' } ]},
    { no:"4", title:"后续运营动作", rows:[
      { k:"内容支持", v:'给到达人抖音爆款选题库参考，协助优化达人内容，稳定发稿频次' },
      { k:"直播规划", v:'协助筹备秋上新大场，借助产品工具（直播预告、贴片等）优化直播间画风、提升进房率，结合资源提升 GMV' },
    ]},
  ],
  verdictTitle:"◆ 引入结论",
  verdict:'种草能力已验证（爆款收藏率突出），<b>直播为核心变现且首播跑通</b>；短板在<span class="hl">工具熟练度与直播间画面</span>，可控可优化。建议<span class="hl">纳入 Q3 重点培育</span>，以秋上新大场为抓手放大 GMV。',
  foot:"达人引入档案 · 规模化直播组 · 2026 Q3",
};

/* ---------- 渲染逻辑（一般无需改动） ---------- */
function rowHTML(r){ return `<div class="row"><div class="lbl${r.warn?' warn':''}">${r.k}</div><div class="val">${r.v}</div></div>`; }
function figHTML(f){ return `<div class="fig"><div class="v${f.dk?' dk':''}">${f.v}</div><div class="l">${f.l}</div></div>`; }
function sectionHTML(s){
  let inner="";
  if(s.work) inner+=`<div class="work">${s.work}</div>`;
  if(s.figs) inner+=`<div class="figs">${s.figs.map(figHTML).join("")}</div>`;
  if(s.rows) inner+=s.rows.map(rowHTML).join("");
  if(s.cmp) inner+=`<div class="cmp">${s.cmp}</div>`;
  if(s.itemsTitle) inner+=`<div style="padding:10px 0 4px;"><span class="lbl warn" style="width:auto;">${s.itemsTitle}</span></div>`;
  if(s.items) inner+=`<div class="items">${s.items.map((t,i)=>`<div class="item"><span class="no">${i+1}</span><span>${t}</span></div>`).join("")}</div>`;
  if(s.rows2) inner+=s.rows2.map(rowHTML).join("");
  const meta = s.meta?`<span class="sec-m">${s.meta}</span>`:"";
  return `<div class="sec"><div class="sec-h"><span class="sec-n">${s.no}</span><span class="sec-t">${s.title}</span>${meta}</div><div class="card">${inner}</div></div>`;
}
function render(){
  let h="";
  h+=`<div class="chips">${DATA.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>`;
  h+=DATA.sections.map(sectionHTML).join("");
  h+=`<div class="verdict"><div class="vt">${DATA.verdictTitle}</div><div class="vc">${DATA.verdict}</div></div>`;
  h+=`<div class="foot">${DATA.foot}</div>`;
  document.getElementById("body").innerHTML=h;
}
render();
</script>
</body>
</html>
